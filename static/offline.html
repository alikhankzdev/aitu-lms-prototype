<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AITU LMS · Offline</title><style>body{margin:0;background:#f3f5f8;color:#112440;font:18px/1.6 system-ui,sans-serif}main{max-width:560px;margin:12vh auto;padding:24px}h1{font-size:32px;line-height:1.2}a{display:inline-block;background:#174ec5;color:#fff;padding:12px 20px;border-radius:6px;text-decoration:none}a:focus-visible{outline:3px solid #a87900;outline-offset:4px}nav{display:flex;gap:16px}nav button{font:inherit;background:none;border:0;padding:8px;cursor:pointer;color:#174ec5}button:focus-visible{outline:3px solid #174ec5}</style></head><body><main><strong>AITU LMS</strong><nav aria-label="Language"><button lang="kk" data-lang="kk">ҚАЗ</button><button lang="ru" data-lang="ru">РУС</button><button lang="en" data-lang="en">ENG</button></nav><h1 id="title">Нет соединения с сайтом</h1><p id="message">Проверьте интернет и убедитесь, что сервер LMS запущен. Курсы, оценки и отправка работ доступны после восстановления соединения.</p><a id="retry" href="/dashboard">Повторить</a></main><script>const copy={ru:['Нет соединения с сайтом','Проверьте интернет и убедитесь, что сервер LMS запущен. Курсы, оценки и отправка работ доступны после восстановления соединения.','Повторить'],kk:['Сайтпен байланыс жоқ','Интернетті тексеріп, LMS серверінің іске қосылғанына көз жеткізіңіз. Курстар, бағалар және тапсырма жіберу байланыс қалпына келгеннен кейін қолжетімді болады.','Қайталау'],en:['Cannot connect to the site','Check your connection and make sure the LMS server is running. Courses, grades and submissions are available when the connection returns.','Try again']};function setLanguage(lang){document.documentElement.lang=lang;['title','message','retry'].forEach((id,i)=>document.getElementById(id).textContent=copy[lang][i]);}document.querySelectorAll('[data-lang]').forEach(button=>button.addEventListener('click',()=>setLanguage(button.dataset.lang)));const preferred=(navigator.language||'ru').slice(0,2);setLanguage(copy[preferred]?preferred:'en');</script></body></html>

{% extends 'base.html' %}{% block content %}<div class="login-layout"><section class="login-story"><img class="login-official-logo" src="{{ url_for('static',filename='aitu-official.png') }}" alt="Astana IT University" width="548" height="282"><h1>{{ t('login_title') }}</h1><p>{{ t('login_intro') }}</p><p class="login-project">{{ t('prototype') }}</p></section><section class="login-form panel"><h2>{{ t('sign_in') }}</h2>{% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}<form method="post" novalidate data-dirty="false">{% from '_macros.html' import csrf with context %}{{ csrf() }}<label for="email">{{ t('email') }}</label><input id="email" name="email" type="email" autocomplete="username" autofocus value="{{ email|default('') }}" required><label for="password">{{ t('password') }}</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" required><button type="button" data-password-toggle aria-label="{{ t('show_password') }}" data-show="{{ t('show_password') }}" data-hide="{{ t('hide_password') }}">{{ t('show_password') }}</button></div><button class="button primary wide" data-busy="{{ t('working') }}">{{ t('sign_in') }} <span aria-hidden="true">→</span></button></form><a class="text-link" href="{{ url_for('recover') }}">{{ t('recover') }}</a></section></div>{% endblock %}

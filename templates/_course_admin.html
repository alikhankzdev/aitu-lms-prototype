<details class="course-editor"><summary>{{ t('edit_course') }} · {{ c.course_code }}</summary><form method="post" action="{{ url_for('admin_action') }}" novalidate>{{ csrf() }}<input type="hidden" name="action" value="update_course"><input type="hidden" name="course_id" value="{{ c.id }}"><div class="form-grid"><div><label for="code-{{ c.id }}">{{ t('course_code') }}</label><input id="code-{{ c.id }}" name="course_code" value="{{ c.course_code }}"></div><div><label for="name-{{ c.id }}">{{ t('title') }}</label><input id="name-{{ c.id }}" name="course_name" value="{{ c.course_name }}"></div><div><label for="instructor-{{ c.id }}">{{ t('instructor') }}</label><select id="instructor-{{ c.id }}" name="instructor_id">{% for u in users if u.role=='teacher' %}<option value="{{ u.id }}" {% if u.id==c.instructor_id %}selected{% endif %}>{{ u.full_name }}</option>{% endfor %}</select></div><div><label for="credits-{{ c.id }}">{{ t('credits') }}</label><input id="credits-{{ c.id }}" type="number" name="credits" min="1" max="10" value="{{ c.credits }}"></div></div><button class="button primary">{{ t('save') }}</button></form></details>

{% macro course_card(c) %}<a class="course-card visual-course" href="{{ url_for('course',course_id=c.id) }}"><div class="course-art"><img src="{{ url_for('static',filename='course-'+(c.visual_key|default('general'))+'.webp') }}" srcset="{{ url_for('static',filename='course-'+(c.visual_key|default('general'))+'.webp') }} 640w, {{ url_for('static',filename='course-'+(c.visual_key|default('general'))+'-960.webp') }} 960w" sizes="(max-width:760px) calc(100vw - 32px), (max-width:1100px) 45vw, 30vw" alt="" width="640" height="280" loading="lazy"></div><div class="course-card-body"><div class="course-code">{{ c.course_code }}<span aria-hidden="true">↗</span></div><h3>{{ c.course_name }}</h3><p>{{ c.teacher_name }}</p>{% if user.role=='student' %}<span class="progress-label">{{ t('progress') }} · {{ c.progress }}%</span><progress max="100" value="{{ c.progress }}" aria-label="{{ t('progress') }} {{ c.course_name }}">{{ c.progress }}%</progress>{% endif %}<span class="course-foot">{{ t('open_course') }} →</span></div></a>{% endmacro %}

<form method="get" class="filters" novalidate><div class="search-field"><label class="sr-only" for="q">{{ t('search') }}</label><input id="q" name="q" type="search" value="{{ q }}" placeholder="{{ t('search') }}"><button type="button" class="clear-search" aria-label="{{ t('clear') }}" {% if not q %}hidden{% endif %}>×</button></div><label class="sr-only" for="status">{{ t('status') }}</label><select name="status" id="status">{% for s in ['','pending','submitted','graded','overdue','upcoming'] %}<option value="{{ s }}" {% if status==s %}selected{% endif %}>{{ t(s or 'all') }}</option>{% endfor %}</select><label class="sr-only" for="course-filter">{{ t('course') }}</label><select id="course-filter" name="course_id"><option value="">{{ t('all_courses') }}</option>{% for c in courses %}<option value="{{ c.id }}" {% if request.args.get('course_id')==c.id|string %}selected{% endif %}>{{ c.course_code }}</option>{% endfor %}</select><label class="sr-only" for="sort">{{ t('sort') }}</label><select id="sort" name="sort">{% for value,key in [('due_asc','nearest'),('due_desc','latest_first'),('title','title')] %}<option value="{{ value }}" {% if request.args.get('sort')==value %}selected{% endif %}>{{ t(key) }}</option>{% endfor %}</select><div><label for="from">{{ t('date_from') }}</label><input id="from" name="from" type="date" value="{{ request.args.get('from','') }}"></div><div><label for="to">{{ t('date_to') }}</label><input id="to" name="to" type="date" value="{{ request.args.get('to','') }}"></div><button class="button secondary">{{ t('filter') }}</button></form>
